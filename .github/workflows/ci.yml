name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm turbo run build --filter=@postbench/web... --filter=@postbench/echo
      - run: pnpm --filter @postbench/web exec playwright install --with-deps chromium
      - name: Playwright e2e against a local echo server
        run: |
          node packages/echo/dist/cli.js 5555 &
          ECHO_URL=http://127.0.0.1:5555 pnpm --filter @postbench/web run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  desktop:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Smoke test the Electron app
        run: xvfb-run -a pnpm --filter @postbench/desktop run smoke
      - name: Package AppImage and zip
        run: pnpm --filter @postbench/desktop exec electron-builder --linux AppImage zip --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: postbench-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.zip
          if-no-files-found: error
